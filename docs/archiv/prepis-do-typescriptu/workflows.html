<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grantio — 3 Happy Path Workflows</title>
<style>
:root{--bg:#0d1117;--s:#161b22;--s2:#1c2129;--s3:#21262d;--b:#30363d;--t:#c9d1d9;--td:#8b949e;--a:#58a6ff;--g:#3fb950;--y:#d29922;--r:#f85149;--o:#db6d28;--p:#bc8cff;--pk:#f778ba}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:18px;color:var(--a);margin-bottom:8px}
.subtitle{color:var(--td);font-size:13px;margin-bottom:24px}

/* Scenario tabs */
.scenario-tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--b);padding-bottom:0}
.sc-tab{padding:10px 20px;cursor:pointer;color:var(--td);border-bottom:2px solid transparent;transition:all .15s;font-size:13px;font-family:inherit}
.sc-tab:hover{color:var(--t);background:var(--s2)}
.sc-tab.active{color:var(--a);border-bottom-color:var(--a)}
.sc-tab .badge{font-size:10px;padding:2px 6px;border-radius:8px;margin-left:6px}
.scenario{display:none}.scenario.active{display:block}

/* Scenario header */
.sc-header{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:20px;margin-bottom:20px}
.sc-header h2{font-size:15px;color:var(--a);margin-bottom:8px}
.sc-meta{display:flex;gap:16px;flex-wrap:wrap}
.sc-meta span{font-size:12px;color:var(--td)}
.sc-meta code{background:var(--s2);padding:2px 6px;border-radius:4px;color:var(--p)}

/* Step */
.step{position:relative;margin-bottom:4px}
.step-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--s);border:1px solid var(--b);border-radius:8px;cursor:pointer;transition:all .15s}
.step-header:hover{background:var(--s2)}
.step-header.open{border-radius:8px 8px 0 0;border-bottom-color:transparent}
.step-num{min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.step-agent{font-weight:600;min-width:180px}
.step-summary{color:var(--td);flex:1;font-size:12px}
.step-time{font-size:11px;color:var(--td);min-width:60px;text-align:right}
.step-cost{font-size:11px;color:var(--td);min-width:50px;text-align:right}

.step-body{display:none;background:var(--s);border:1px solid var(--b);border-top:none;border-radius:0 0 8px 8px;padding:0}
.step-body.open{display:block}

/* Sub-sections in step body */
.sub{padding:16px 20px;border-bottom:1px solid var(--b)}
.sub:last-child{border-bottom:none}
.sub h4{font-size:12px;color:var(--td);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.sub pre{background:var(--s2);padding:12px;border-radius:6px;font-size:12px;overflow-x:auto;white-space:pre-wrap;color:var(--td)}
.sub .highlight{color:var(--a)}
.sub .val{color:var(--g)}
.sub .warn{color:var(--y)}
.sub .err{color:var(--r)}

/* File refs */
.file{display:inline-flex;align-items:center;gap:4px;background:var(--s2);padding:2px 8px;border-radius:4px;font-size:11px;margin:2px}
.file.read{color:var(--a)}
.file.write{color:var(--g)}
.file.log{color:var(--y)}

/* Arrow between steps */
.step-arrow{text-align:center;color:var(--b);font-size:18px;padding:2px 0;margin-left:30px}

/* Connector line */
.step::before{content:'';position:absolute;left:29px;top:0;bottom:0;width:2px;background:var(--b);z-index:0}
.step:first-child::before{top:50%}
.step:last-child::before{bottom:50%}
.step-header{position:relative;z-index:1}

/* Phase separator */
.phase-sep{padding:8px 16px;margin:12px 0 12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--td);border-left:2px dashed var(--b)}

/* Data table */
.data-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.data-table th{text-align:left;padding:6px 8px;background:var(--s3);color:var(--td);font-weight:500}
.data-table td{padding:6px 8px;border-bottom:1px solid var(--b)}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin:1px}
.tag-tool{background:rgba(88,166,255,0.15);color:var(--a)}
.tag-scraper{background:rgba(188,140,255,0.15);color:var(--p)}
.tag-gate{background:rgba(210,153,34,0.15);color:var(--y)}

/* SDK primitiv tags */
.tag-sdk{background:rgba(247,120,186,0.15);color:var(--pk);font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600}
.sdk-section{background:var(--s3);border-left:3px solid var(--pk);padding:12px 16px;margin:8px 0;border-radius:0 6px 6px 0}
.sdk-section h5{font-size:11px;color:var(--pk);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.sdk-section pre{background:var(--bg);padding:10px;border-radius:4px;font-size:11px;color:var(--t)}
.feedback-loop{background:rgba(219,109,40,0.1);border:1px dashed var(--o);border-radius:6px;padding:12px;margin:8px 0}
.feedback-loop h5{color:var(--o);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}

/* Skills */
.skills-section{margin-top:8px}
.skill-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.25);padding:4px 10px;border-radius:6px;font-size:11px;margin:3px;cursor:help;transition:all .15s}
.skill-tag:hover{background:rgba(63,185,80,0.2);border-color:var(--g)}
.skill-tag .skill-name{color:var(--g);font-weight:600}
.skill-tag .skill-why{color:var(--td);font-size:10px;margin-left:4px}
</style>
</head>
<body>
<div class="container">
<h1>Grantio — Step-by-Step Workflows</h1>
<p class="subtitle">3 happy path scenare. Klikni na krok pro detail (prompt, data, storage, logy, SDK primitiv). Badge u kroku = SDK primitiv (slash-command, agent, agent+mcp, agent+schema, hook+mcp).</p>

<div class="scenario-tabs">
  <div class="sc-tab active" onclick="showScenario(0,this)">Scenario 1<span class="badge" style="background:rgba(63,185,80,0.2);color:var(--g)">HTML 1 cat</span></div>
  <div class="sc-tab" onclick="showScenario(1,this)">Scenario 2<span class="badge" style="background:rgba(210,153,34,0.2);color:var(--y)">XLS+PDF</span></div>
  <div class="sc-tab" onclick="showScenario(2,this)">Scenario 3<span class="badge" style="background:rgba(188,140,255,0.2);color:var(--p)">API 3 cat</span></div>
</div>

<div id="scenarios"></div>
</div>

<script>
const scenarios = [
// ============================================================
// SCENARIO 1: HTML, 1 catalog, 100 grants
// ============================================================
{
  title: "HTML zdroj, 1 katalog, 100 grantu",
  desc: "Ministerstvo XY — staticka HTML stranka s paginovanym seznamem a detail strankami",
  meta: { url:"https://dotace.example.cz", type:"html_catalog", catalogs:1, grants:100, pages:10, strategy:"html_catalog_html_grants" },
  steps: [
  // --- STEP 0: CLI → Orchestrator ---
  {
    agent:"CLI → Orchestrator", color:"var(--y)", time:"<1s", cost:"—",
    summary: "grantio add https://dotace.example.cz",
    sdk_type: "slash-command",
    prompt: `Uzivatel zadal: grantio add https://dotace.example.cz
Orchestrator SKILL.md rika: vytvor projekt, nastav status CREATED.`,
    input: `{ url: "https://dotace.example.cz" }`,
    tools: ["write_status"],
    actions: `1. Vygeneruje slug: "dotace-example-cz"
2. Vytvori sources/dotace-example-cz/status.json
3. Vytvori prazdne adresare: scouts/, configs/, runs/, memory/`,
    storage: [
      { op:"WRITE", path:"sources/dotace-example-cz/status.json", content:'{ "source_id": "dotace-example-cz", "url": "https://dotace.example.cz", "phase": "CREATED", "created_at": "2026-03-09T10:00:00Z" }' },
    ],
    logs: `[ORCH] Created project dotace-example-cz (https://dotace.example.cz)`,
    returns: `{ status: "created", slug: "dotace-example-cz" }`,
    sdk_call: `// .claude/commands/add.md → slash command
// Uzivatel spusti: /add https://dotace.example.cz
// Orchestrator session zpracuje jako prompt:

for await (const msg of query({
  prompt: "/add https://dotace.example.cz",
  options: {
    systemPrompt: { preset: "claude_code", append: orchestrationSkill },
    settingSources: ["project"],  // nacte .claude/commands/add.md
    mcpServers: { grantio: grantioTools },
    allowedTools: ["Agent", "Read", "Write", "mcp__grantio__write_status"],
  }
}));`,
    sdk_notes: "Slash command /add je .claude/commands/add.md s frontmatter (allowed-tools, argument-hint). $1 = URL."
  },

  // --- STEP 1: Scout Source ---
  { phase: "SCOUTING" },
  {
    agent:"scout-source", color:"var(--a)", time:"~15s", cost:"$0.04",
    sdk_type: "agent",
    summary: "Analyzuj web, najdi katalogy, urc typ zdroje",
    skills: [
      { name:"grant-schemas", use:"ví co hledat (typy zdrojů, katalogů)", why:"Scout potřebuje znát typy grantových zdrojů a katalogů, aby věděl co na webu hledá" },
      { name:"czech-parsing", use:"rozpozná CZ formáty na webu", why:"Rozpozná české datumy, částky, právní formy přímo na webové stránce" },
    ],
    prompt: `## Systemovy prompt (L0)
Jsi scout-source agent. Tvuj ukol je analyzovat grantovy web a najit katalogy.

## Task prompt (L1)
Workspace: sources/dotace-example-cz/
URL: https://dotace.example.cz
Attempt: 1

Prozkoumej web. Najdi:
1. Typ zdroje (static HTML, SPA, API, PDF portal)
2. Vsechny katalogy (stranky se seznamem grantu/vyzev)
3. Jazyk, anti-bot ochranu, auth

Vysledky zapis do: sources/dotace-example-cz/scouts/

## Domain knowledge (L2)
Ceske grantove weby typicky maji: /vyzvy, /dotace, /programy...

## Memory (L6) — prazdne (prvni run)`,
    input: `Zadna data — agent si vsechno fetchne sam.
Prompt obsahuje jen cestu k workspace a URL.`,
    tools: ["WebFetch", "WebSearch", "Read", "source_memory"],
    actions: `1. WebFetch(https://dotace.example.cz) → HTML hlavni stranky
2. Parsuje navigaci, hleda /vyzvy, /dotace, /granty linky
3. WebFetch(/vyzvy) → najde HTML listing s 10 polozkami na strance
4. Detekuje paginaci (?page=2, ?page=3...)
5. WebFetch(/vyzvy?page=2) → overeni ze paginace funguje
6. Zapise do source_memory("structure", "replace", "HTML listing na /vyzvy, 10 items/page, ?page= paginace")`,
    storage: [
      { op:"WRITE", path:"sources/dotace-example-cz/scouts/2026-03-09_source.json", content:`{
  "source_type": "static",
  "catalogs": [{
    "name": "Vyzvy",
    "url": "https://dotace.example.cz/vyzvy",
    "estimated_count": 100,
    "strategy_hint": "html_catalog_html_grants",
    "pagination": { "type": "page_param", "param": "page" }
  }],
  "anti_bot": false,
  "auth_required": false,
  "language": "cs",
  "confidence": 0.92,
  "issues": [],
  "suggestions": ["Paginace ma 10 stranek"]
}` },
      { op:"WRITE", path:"sources/dotace-example-cz/memory/structure.md", content:"HTML listing na /vyzvy, 10 items/page, ?page= paginace, 10 pages" },
    ],
    logs: `[scout-source] WebFetch https://dotace.example.cz → 200 OK (12KB)
[scout-source] Found nav links: /vyzvy, /o-nas, /kontakt
[scout-source] WebFetch /vyzvy → 200 OK (45KB), found 10 listing items
[scout-source] Detected pagination: ?page=1..10
[scout-source] Confidence: 0.92, 1 catalog found`,
    returns: `ScoutSourceOutput {
  source_type: "static",
  catalogs: [{ name: "Vyzvy", url: ".../vyzvy", estimated_count: 100 }],
  confidence: 0.92
}`,
    sdk_call: `// Orchestrator dispatchi sub-agenta pres Agent tool:
// agents config v query() definuje scout-source

agents: {
  'scout-source': {
    description: 'Analyzuje grantovy web, najde katalogy, urci typ zdroje',
    prompt: scoutSourcePromptFactory("dotace-example-cz"),  // L0-L6 compose
    tools: ['Read', 'Glob', 'Grep', 'WebFetch', 'WebSearch',
            'mcp__grantio__source_memory'],
    model: 'sonnet'
  }
}

// Orchestrator prompt rika: "Pouzij scout-source agenta na dotace-example-cz"
// SDK automaticky dispatchi Agent tool s timto promptem.`,
    sdk_notes: "Agent je definovan programaticky (factory funkce), ne staticky .claude/agents/scout-source.md, protoze prompt se sestavuje dynamicky (7 vrstev)."
  },

  // --- STEP 2: Scout Catalog ---
  {
    agent:"scout-catalog", color:"var(--a)", time:"~10s", cost:"$0.03",
    sdk_type: "agent",
    summary: "Zmapuj katalog — listing selektory, pagination, pole",
    skills: [
      { name:"grant-schemas", use:"jaká pole očekávat v listingu", why:"Zná GrantOpportunity schema — ví které pole se typicky objeví v listing view vs detail view" },
    ],
    prompt: `## L0: Jsi scout-catalog agent.
## L1: Workspace: sources/dotace-example-cz/
Precti scouts/2026-03-09_source.json — tam najdes katalogy.
Zmapuj katalog "Vyzvy" (URL: /vyzvy).
Najdi: listing CSS selektor, pagination, pole, detail URL pattern.
Vysledky zapis do: scouts/2026-03-09_catalog-vyzvy.json

## L2: Domain knowledge (ceske granty)
## L3: Source type = static HTML (html_listing.md)
Staticke HTML listingy typicky pouzivaji <table> nebo <div class="item">.`,
    input: `Zadna data v inputu — agent si precte scouts/source.json
a fetchne HTML stranku sam.`,
    tools: ["WebFetch", "Read", "source_memory"],
    actions: `1. WebFetch(/vyzvy) → HTML
2. Analyzuje DOM: najde .grant-list .grant-item (opakuje se 10x)
3. V kazdem .grant-item najde: h3 a (title+URL), .date (deadline), .amount
4. Detekuje detail URL pattern: /vyzvy/{slug}
5. Overuje paginaci: .pagination a[href] → 10 stranek
6. WebFetch(/vyzvy?page=10) → overeni posledni stranky`,
    storage: [
      { op:"WRITE", path:"sources/dotace-example-cz/scouts/2026-03-09_catalog-vyzvy.json", content:`{
  "listing_selector": ".grant-list .grant-item",
  "item_count": 100,
  "pagination": { "type": "page_param", "param": "page", "total_pages": 10 },
  "fields_available": ["title", "url", "deadline", "amount_max"],
  "detail_url_pattern": "/vyzvy/{slug}",
  "strategy": "html_catalog",
  "sample_detail_urls": [
    "https://dotace.example.cz/vyzvy/program-alfa",
    "https://dotace.example.cz/vyzvy/vyzva-2026-01",
    "https://dotace.example.cz/vyzvy/podpora-vedy"
  ],
  "confidence": 0.95
}` },
    ],
    logs: `[scout-catalog] WebFetch /vyzvy → 200 OK
[scout-catalog] Found repeating pattern: .grant-list .grant-item (10 items)
[scout-catalog] Fields in listing: title (h3 a), deadline (.date), amount (.amount)
[scout-catalog] Detail URL pattern: /vyzvy/{slug}
[scout-catalog] Pagination: .pagination a → 10 pages confirmed`,
    returns: `ScoutCatalogOutput {
  listing_selector: ".grant-list .grant-item",
  item_count: 100,
  pagination: { type: "page_param", total_pages: 10 },
  fields_available: ["title", "url", "deadline", "amount_max"],
  detail_url_pattern: "/vyzvy/{slug}",
  confidence: 0.95
}`,
    sdk_call: `// Strukturovany output — scout vraci JSON schema:
agents: {
  'scout-catalog': {
    description: '...',
    prompt: scoutCatalogPromptFactory("dotace-example-cz", "Vyzvy"),
    tools: ['WebFetch', 'Read', 'mcp__grantio__source_memory'],
    model: 'sonnet',
  }
}

// outputFormat by se dal pridat pro garanci JSON struktury:
// outputFormat: { type: 'json_schema', schema: ScoutCatalogSchema }
// Ale scout zapisuje na filesystem, takze output je sekundarni.`,
    sdk_notes: "Pro vice katalogu orchestrator spousti vice scout-catalog agentu paralelne (kazdy s jinym katalogem v promptu)."
  },

  // --- STEP 3: Scout Opportunity ---
  {
    agent:"scout-opportunity", color:"var(--a)", time:"~12s", cost:"$0.04",
    sdk_type: "agent",
    summary: "Zmapuj detail vyzvy — schema mapping, pole, prilohy",
    skills: [
      { name:"grant-schemas", use:"mapuje DOM na GrantOpportunity schema", why:"Musí znát všech 18+ polí schema a jejich typy, aby správně namapoval CSS selektory" },
      { name:"czech-parsing", use:"parsuje vzorkové hodnoty", why:"Rozpozná české datumy ('31. 3. 2026'), částky ('5 mil. Kč') ve vzorcích" },
      { name:"extraction-pipeline", use:"rozumí 6-level fallback", why:"Ví že CSS first, LLM fallback — navrhuje správnou extraction strategii" },
    ],
    prompt: `## L0: Jsi scout-opportunity agent.
## L1: Workspace: sources/dotace-example-cz/
Precti scouts/catalog-vyzvy.json — tam najdes sample_detail_urls.
Zmapuj detail stranku na prvnim URL ze sample.
Najdi: vsechna pole z GrantOpportunity schema, CSS selektory, prilohy.
Vysledky zapis do: scouts/2026-03-09_opportunity-sample.json

## L2: Domain knowledge + field definitions
## L3: Source type = static HTML`,
    input: `Zadna data — agent si precte scouts/catalog-vyzvy.json,
vybere sample URL a fetchne detail stranku sam.`,
    tools: ["WebFetch", "Read", "source_memory"],
    actions: `1. WebFetch(/vyzvy/program-alfa) → detail HTML
2. Mapuje DOM na GrantOpportunity schema:
   - h1.title → title
   - .description → description
   - .provider → provider
   - .deadline-date → deadline
   - .amount-range → amount_min, amount_max
   - .eligibility-list li → eligibility
   - .attachments a[href$=".pdf"] → prilohy
3. Overuje na 2 dalsich detail strankach (vyzva-2026-01, podpora-vedy)
4. Zapise findings`,
    storage: [
      { op:"WRITE", path:"sources/dotace-example-cz/scouts/2026-03-09_opportunity-sample.json", content:`{
  "fields": {
    "title": { "selector": "h1.title", "method": "css", "sample": "Program ALFA", "confidence": 0.99 },
    "description": { "selector": ".description", "method": "css", "sample": "Program na podporu...", "confidence": 0.95 },
    "provider": { "selector": ".provider", "method": "css", "sample": "Ministerstvo XY", "confidence": 0.99 },
    "deadline": { "selector": ".deadline-date", "method": "css+regex", "sample": "31. 3. 2026", "confidence": 0.90 },
    "amount_min": { "selector": ".amount-range", "method": "css+regex", "sample": "500 000 Kc", "confidence": 0.85 },
    "amount_max": { "selector": ".amount-range", "method": "css+regex", "sample": "5 mil. Kc", "confidence": 0.85 },
    "eligibility": { "selector": ".eligibility-list li", "method": "css", "sample": ["s.r.o.", "a.s.", "VS"], "confidence": 0.80 }
  },
  "attachments": [
    { "type": "pdf", "url_pattern": ".attachments a[href$=\\".pdf\\"]", "contains_data": true }
  ],
  "schema_coverage": 0.78,
  "confidence": 0.88
}` },
    ],
    logs: `[scout-opp] WebFetch /vyzvy/program-alfa → 200 OK (28KB)
[scout-opp] Mapped 7/18 fields from GrantOpportunity schema
[scout-opp] Found 2 PDF attachments
[scout-opp] Cross-checked with /vyzvy/vyzva-2026-01 — selectors consistent
[scout-opp] Schema coverage: 78%, confidence: 0.88`,
    returns: `ScoutOpportunityOutput {
  fields: { title: {...}, description: {...}, ... },
  attachments: [{ type: "pdf", ... }],
  schema_coverage: 0.78,
  confidence: 0.88
}`,
    sdk_call: `// Scout-opportunity bere sample URLs z predchoziho scouta:
agents: {
  'scout-opportunity': {
    description: 'Zmapuje detail stranku — schema mapping, pole, prilohy',
    prompt: scoutOpportunityPromptFactory("dotace-example-cz"),
    tools: ['WebFetch', 'Read', 'mcp__grantio__source_memory'],
    model: 'sonnet',
  }
}
// Agent si precte scouts/catalog-vyzvy.json → najde sample_detail_urls
// Cely kontext dostane v promptu (workspace cesta), data cte z filesystemu.`
  },

  // --- PHASE: BUILDING ---
  { phase: "BUILDING" },

  // --- STEP 4: Config Catalog ---
  {
    agent:"config-catalog", color:"var(--p)", time:"~45s", cost:"$0.15",
    sdk_type: "agent+mcp",
    summary: "Generuj listing config, spust scraper, ziskej listing URLs",
    skills: [
      { name:"yaml-config", use:"generuje YAML config", why:"Zná YAML config format, templates per strategie (html_catalog, api_catalog...), validační pravidla" },
      { name:"czech-parsing", use:"nastavuje transforms", why:"Ví které transforms použít: parse_czech_date, parse_czech_amount v YAML field definicích" },
    ],
    prompt: `## L0: Jsi config-catalog agent.
## L1: Workspace: sources/dotace-example-cz/
Precti scout findings: scouts/*.json
Vygeneruj YAML config pro listing.
Zapis config do: configs/catalog.v1.yml

Spust scraper — nejdriv test (prvnich 5 URLs), pak full run.
Listing URLs uloz do: runs/run-001/listing_urls.json

## L2: Domain knowledge
## L3: html_listing.md — staticke HTML: pouzij scrapy_run
## L4: Hints — zadne (prvni run)
## SKILL: yaml-config`,
    input: `Zadna data v inputu — agent si precte:
- scouts/2026-03-09_source.json
- scouts/2026-03-09_catalog-vyzvy.json
- scouts/2026-03-09_opportunity-sample.json`,
    tools: ["Read", "Write", "Edit", "scrapy_run", "WebFetch", "source_memory"],
    actions: `1. Generuje YAML config (configs/catalog.v1.yml):
   - source.url, source.name
   - catalogs[0].listing_url, selector, pagination, fields, detail_url_pattern

2. Write(configs/catalog.v1.yml)

3. scrapy_run(config=catalog.v1.yml, max_items=5) → TEST na 5
   → 5 items, pagination funguje, URLs OK

// RENDER
// ============================================================
function renderScenario(sc, idx) {
  let html = `
    <div class="sc-header">
      <h2>${sc.title}</h2>
      <p style="color:var(--td);margin-bottom:8px;">${sc.desc}</p>
      <div class="sc-meta">
        <span>URL: <code>${sc.meta.url}</code></span>
        <span>Type: <code>${sc.meta.type}</code></span>
        <span>Catalogs: <code>${sc.meta.catalogs}</code></span>
        <span>Grants: <code>${sc.meta.grants}</code></span>
        ${sc.meta.strategy ? `<span>Strategy: <code>${sc.meta.strategy}</code></span>` : ''}
      </div>
    </div>
  `;

  let stepNum = 0;
  sc.steps.forEach((step, i) => {
    if (step.phase) {
      html += `<div class="phase-sep">${step.phase}</div>`;
      return;
    }
    stepNum++;
    const id = `sc${idx}-step${i}`;
    html += `
      <div class="step">
        <div class="step-header" onclick="toggleStep('${id}')">
          <div class="step-num" style="background:${step.color}">${stepNum}</div>
          <div class="step-agent">${step.agent}</div>
          <div class="step-summary">${step.summary}</div>
          <div class="step-time">${step.time}</div>
          <div class="step-cost">${step.cost}</div>
          ${step.sdk_type ? `<span class="tag-sdk">${step.sdk_type}</span>` : ''}
        </div>
        <div class="step-body" id="${id}">
          <div class="sub">
            <h4>Prompt (co agent dostane)</h4>
            <pre>${escHtml(step.prompt)}</pre>
          </div>
          <div class="sub">
            <h4>Input data</h4>
            <pre>${escHtml(step.input)}</pre>
          </div>
          <div class="sub">
            <h4>Tools</h4>
            <div>${(step.tools||[]).map(t => `<span class="tag ${t.includes('run')?'tag-scraper':'tag-tool'}">${t}</span>`).join(' ')}</div>
          </div>
          ${step.skills ? `
          <div class="sub">
            <h4>Skills (SKILL.md)</h4>
            <div class="skills-section">
              ${step.skills.map(s => `<div class="skill-tag" title="${escHtml(s.why)}"><span class="skill-name">${s.name}</span><span class="skill-why">— ${s.use}</span></div>`).join('')}
            </div>
          </div>` : ''}
          <div class="sub">
            <h4>Co agent dela (akce)</h4>
            <pre>${escHtml(step.actions)}</pre>
          </div>
          <div class="sub">
            <h4>Storage (co kam ulozi)</h4>
            ${(step.storage||[]).map(s => `
              <div style="margin:6px 0;">
                <span class="file ${s.op === 'WRITE' ? 'write' : s.op === 'APPEND' ? 'log' : 'read'}">${s.op}</span>
                <code style="font-size:11px">${s.path}</code>
                <pre style="margin-top:4px;font-size:11px;">${escHtml(s.content)}</pre>
              </div>
            `).join('')}
          </div>
          <div class="sub">
            <h4>Logy</h4>
            <pre style="color:var(--y)">${escHtml(step.logs)}</pre>
          </div>
          <div class="sub">
            <h4>Return value (co vrati orchestratoru)</h4>
            <pre style="color:var(--g)">${escHtml(step.returns)}</pre>
          </div>
          ${step.sdk_call ? `
          <div class="sub">
            <div class="sdk-section">
              <h5>🔧 SDK Primitiv</h5>
              <pre>${escHtml(step.sdk_call)}</pre>
            </div>
            ${step.sdk_notes ? `<p style="font-size:11px;color:var(--td);margin-top:8px;padding:0 4px">${step.sdk_notes}</p>` : ''}
          </div>` : ''}
          ${step.feedback_loop ? `
          <div class="sub">
            <div class="feedback-loop">
              <h5>↩ Feedback Loop (max ${step.feedback_loop.max_attempts} attempts)</h5>
              <pre>${escHtml(step.feedback_loop.description)}</pre>
            </div>
          </div>` : ''}
        </div>
      </div>
    `;
  });

  return html;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleStep(id) {
  const body = document.getElementById(id);
  const header = body.previousElementSibling;
  body.classList.toggle('open');
  header.classList.toggle('open');
}

function showScenario(idx, el) {
  document.querySelectorAll('.sc-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('scenarios').innerHTML = `<div class="scenario active">${renderScenario(scenarios[idx], idx)}</div>`;
}

// Init
showScenario(0, document.querySelector('.sc-tab'));
</script>
